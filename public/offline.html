<!DOCTYPE html>
<html lang="en-NG">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Lokoja Life — offline</title>
<meta name="theme-color" content="#146b3a" />
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f5edd8; color: #1c2b22;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  .card { max-width: 420px; }
  .sun { font-size: 56px; line-height: 1; margin-bottom: 16px; }
  h1 {
    font-size: 26px; font-weight: 800; color: #146b3a;
    letter-spacing: -0.02em; margin-bottom: 10px;
  }
  p { font-size: 15px; line-height: 1.55; color: #4a5a50; margin-bottom: 8px; }
  .hint { margin-top: 18px; font-size: 13px; color: #6b7a70; }
  .rule { width: 64px; height: 3px; background: #146b3a; border-radius: 2px; margin: 18px auto; opacity: .35; }
  button {
    margin-top: 14px; padding: 12px 26px; font-size: 15px; font-weight: 700;
    color: #fff; background: #146b3a; border: 0; border-radius: 12px;
  }
  button:active { opacity: .85; }
</style>
</head>
<body>
  <div class="card">
    <div class="sun">🌅</div>
    <h1>The street is quiet</h1>
    <p>This page needs the network — and right now the network needs rest.</p>
    <p>Your life in Lokoja dey safe: everything you saved stays on this phone.</p>
    <div class="rule"></div>
    <div class="hint">When the connection comes back, the city opens again — and any cloud sync waiting will ride out on its own.</div>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
